<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Url Ultra - Smart Link Shortener & OG Card Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #090b10; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .glass-card { background: #111520; border: 1px solid #1e2538; }
        .tab-active { background: #2563eb; color: white; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="border-b border-slate-800 bg-[#0d1017] px-4 py-3 sticky top-0 z-50">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-white">U</div>
                <span class="font-bold text-lg tracking-tight">Url Ultra</span>
            </div>
            <button onclick="loadHistory()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-slate-300">
                <i class="fa-solid fa-clock-rotate-left mr-1"></i> My Links
            </button>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-6 space-y-6">

        <!-- Hero -->
        <div class="text-center space-y-1">
            <h1 class="text-2xl font-extrabold text-white">Create Viral Social Cards & Links</h1>
            <p class="text-xs text-slate-400">Shorten URLs, add custom thumbnails, play buttons & media endings</p>
        </div>

        <!-- Mode Tabs -->
        <div class="grid grid-cols-3 gap-2 p-1 rounded-xl glass-card">
            <button onclick="switchTab('short')" id="tab-short" class="tab-active py-2 rounded-lg text-xs font-semibold transition">
                <i class="fa-solid fa-link mr-1"></i> Short Link
            </button>
            <button onclick="switchTab('card')" id="tab-card" class="py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition">
                <i class="fa-solid fa-image mr-1"></i> Image Card
            </button>
            <button onclick="switchTab('play')" id="tab-play" class="py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition">
                <i class="fa-solid fa-circle-play mr-1"></i> Play Button
            </button>
        </div>

        <!-- Link Generator Form -->
        <div id="generator-box" class="glass-card p-5 rounded-2xl space-y-4 shadow-xl">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Destination Target URL *</label>
                <input type="url" id="targetUrl" placeholder="https://your-offer-link.com/..." class="w-full bg-[#090b10] border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>

            <!-- Extra Fields for Image Card -->
            <div id="card-fields" class="hidden space-y-4 pt-2 border-t border-slate-800">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Thumbnail Image URL *</label>
                    <input type="url" id="imageUrl" placeholder="https://i.ibb.co/.../image.jpg" class="w-full bg-[#090b10] border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
                    <p class="text-[11px] text-slate-500 mt-1">Tip: Upload image on <a href="https://imgbb.com" target="_blank" class="text-blue-400 underline">imgbb.com</a> & paste Direct Link.</p>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Card Title</label>
                        <input type="text" id="cardTitle" placeholder="Watch Full Video (18+)" class="w-full bg-[#090b10] border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Fake Media Ending</label>
                        <select id="linkEnding" class="w-full bg-[#090b10] border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white">
                            <option value="">None (Standard)</option>
                            <option value=".mp4">.mp4 (Video)</option>
                            <option value=".stream">.stream (Live)</option>
                            <option value=".video">.video (HD)</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Card Description</label>
                    <input type="text" id="cardDesc" placeholder="Click here to watch the full exclusive video..." class="w-full bg-[#090b10] border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Custom Alias (Optional)</label>
                    <input type="text" id="customSlug" placeholder="viral-video" class="w-full bg-[#090b10] border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white">
                </div>
                <div class="flex items-end">
                    <button onclick="createLink()" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-xl text-sm transition shadow-lg shadow-blue-600/20">
                        Generate Link
                    </button>
                </div>
            </div>

            <!-- Result Box -->
            <div id="resultBox" class="hidden p-4 rounded-xl bg-emerald-950/40 border border-emerald-700/50 space-y-2">
                <p class="text-xs text-emerald-400 font-semibold"><i class="fa-solid fa-circle-check mr-1"></i> Your Link is Ready!</p>
                <div class="flex items-center gap-2">
                    <input type="text" id="generatedUrl" readonly class="w-full bg-[#090b10] border border-slate-700 rounded-lg px-3 py-2 text-xs text-emerald-300 font-mono">
                    <button onclick="copyGenerated()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-xs font-semibold">Copy</button>
                </div>
            </div>
        </div>

        <!-- Play Button Thumbnail Overlay Maker -->
        <div id="play-tool-box" class="hidden glass-card p-5 rounded-2xl space-y-4">
            <h2 class="text-sm font-bold text-white"><i class="fa-solid fa-wand-magic-sparkles text-blue-400 mr-1"></i> Add Play Button & Duration to Thumbnail</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Select Image from Phone</label>
                    <input type="file" id="thumbUpload" accept="image/*" onchange="drawThumbnail()" class="w-full text-xs text-slate-300 bg-[#090b10] border border-slate-700 rounded-xl p-2">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Video Duration Badge</label>
                    <input type="text" id="videoTime" value="14:28" oninput="drawThumbnail()" class="w-full bg-[#090b10] border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                </div>
            </div>
            <div class="flex flex-col items-center space-y-3">
                <canvas id="thumbCanvas" class="max-w-full rounded-xl border border-slate-700 hidden"></canvas>
                <button id="downloadThumbBtn" onclick="downloadThumbnail()" class="hidden bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-xl text-xs font-semibold">
                    <i class="fa-solid fa-download mr-1"></i> Download Thumbnail
                </button>
            </div>
        </div>

        <!-- Recent Links History -->
        <div class="glass-card p-5 rounded-2xl space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="text-sm font-bold text-white">Recent Generated Links</h3>
                <button onclick="loadHistory()" class="text-xs text-blue-400 hover:underline">Refresh</button>
            </div>
            <div id="linksList" class="space-y-2 text-xs text-slate-400">Loading links...</div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://nccgkccjbrojavagmpbf.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_uVtTSdbdFwyYgCaER986oQ_E6WwbJuH';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentMode = 'short';

        function switchTab(mode) {
            currentMode = mode;
            ['short', 'card', 'play'].forEach(t => {
                document.getElementById('tab-' + t).className = (t === mode) 
                    ? 'tab-active py-2 rounded-lg text-xs font-semibold transition' 
                    : 'py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition';
            });

            if (mode === 'play') {
                document.getElementById('generator-box').classList.add('hidden');
                document.getElementById('play-tool-box').classList.remove('hidden');
            } else {
                document.getElementById('generator-box').classList.remove('hidden');
                document.getElementById('play-tool-box').classList.add('hidden');
                document.getElementById('card-fields').classList.toggle('hidden', mode !== 'card');
            }
        }

        function randomSlug() {
            return Math.random().toString(36).substring(2, 8);
        }

        async function createLink() {
            const targetUrl = document.getElementById('targetUrl').value.trim();
            if (!targetUrl) return alert('Please enter a Target URL!');

            const btn = document.getElementById('submitBtn');
            btn.innerText = 'Creating...';
            btn.disabled = true;

            const slug = (document.getElementById('customSlug').value.trim() || randomSlug()).replace(/[^a-zA-Z0-9-_]/g, '');
            const imageUrl = document.getElementById('imageUrl').value.trim();
            const title = document.getElementById('cardTitle').value.trim();
            const description = document.getElementById('cardDesc').value.trim();
            const ending = document.getElementById('linkEnding').value;

            const { data, error } = await db.from('links').insert([{
                slug, target_url: targetUrl, link_type: currentMode,
                image_url: imageUrl, title, description, ending
            }]).select();

            btn.innerText = 'Generate Link';
            btn.disabled = false;

            if (error) {
                alert('Error: ' + error.message);
            } else {
                const finalLink = `${window.location.origin}/v/${slug}${ending}`;
                document.getElementById('generatedUrl').value = finalLink;
                document.getElementById('resultBox').classList.remove('hidden');
                loadHistory();
            }
        }

        function copyGenerated() {
            const copyText = document.getElementById('generatedUrl');
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert('Link Copied!');
        }

        async function loadHistory() {
            const listEl = document.getElementById('linksList');
            const { data, error } = await db.from('links').select('*').order('created_at', { ascending: false }).limit(10);
            if (error || !data.length) {
                listEl.innerHTML = '<p class="text-slate-500">No links created yet.</p>';
                return;
            }
            listEl.innerHTML = data.map(item => {
                const fullUrl = `${window.location.origin}/v/${item.slug}${item.ending || ''}`;
                return `
                <div class="p-3 rounded-xl bg-[#090b10] border border-slate-800 flex justify-between items-center gap-2">
                    <div class="truncate">
                        <p class="text-blue-400 font-mono font-semibold truncate">${fullUrl}</p>
                        <p class="text-[11px] text-slate-500 truncate">${item.target_url}</p>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                        <span class="bg-slate-800 px-2 py-1 rounded text-[11px] text-slate-300">${item.clicks} clicks</span>
                        <button onclick="navigator.clipboard.writeText('${fullUrl}'); alert('Copied!')" class="bg-slate-800 hover:bg-slate-700 p-2 rounded-lg text-white">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                    </div>
                </div>`;
            }).join('');
        }

        function drawThumbnail() {
            const file = document.getElementById('thumbUpload').files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.getElementById('thumbCanvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);

                    const cx = canvas.width / 2;
                    const cy = canvas.height / 2;
                    const r = Math.min(canvas.width, canvas.height) * 0.12;
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, 2 * Math.PI);
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
                    ctx.fill();
                    ctx.lineWidth = r * 0.08;
                    ctx.strokeStyle = '#ffffff';
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(cx - r * 0.3, cy - r * 0.45);
                    ctx.lineTo(cx + r * 0.5, cy);
                    ctx.lineTo(cx - r * 0.3, cy + r * 0.45);
                    ctx.closePath();
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();

                    const timeText = document.getElementById('videoTime').value || '12:45';
                    const fontSize = Math.max(16, Math.floor(canvas.width * 0.035));
                    ctx.font = `bold ${fontSize}px sans-serif`;
                    const textW = ctx.measureText(timeText).width;
                    const pad = fontSize * 0.4;
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                    ctx.fillRect(canvas.width - textW - pad * 3, canvas.height - fontSize - pad * 2.5, textW + pad * 2, fontSize + pad * 1.5);
                    ctx.fillStyle = '#ffffff';
                    ctx.fillText(timeText, canvas.width - textW - pad * 2, canvas.height - pad * 1.4);

                    canvas.classList.remove('hidden');
                    document.getElementById('downloadThumbBtn').classList.remove('hidden');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function downloadThumbnail() {
            const canvas = document.getElementById('thumbCanvas');
            const link = document.createElement('a');
            link.download = 'viral-thumbnail.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        loadHistory();
    </script>
</body>
                  </html>
